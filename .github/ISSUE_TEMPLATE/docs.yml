name: Docs fix
description: Typos, unclear explanations, broken links.
title: "[docs]: "
labels: ["docs"]
body:
  - type: textarea
    id: where
    attributes:
      label: Where is the problem?
      description: File and section, or a link.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what should it say?
    validations:
      required: true
